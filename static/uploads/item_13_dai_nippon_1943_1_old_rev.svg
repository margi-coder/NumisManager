<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="bgGrad_13_REV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2214"/>
      <stop offset="50%" stop-color="#5e3620"/>
      <stop offset="100%" stop-color="#3b2214"/>
    </linearGradient>
    <pattern id="guilloche_13_REV" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 5 0 10 10 T 20 10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
      <path d="M 10 0 Q 0 5 10 10 T 10 20" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="0.8"/>
    </pattern>
    <pattern id="dots_13_REV" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.6" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="700" height="350" rx="10" fill="url(#bgGrad_13_REV)"/>
  <rect width="700" height="350" fill="url(#guilloche_13_REV)"/>
  <rect width="700" height="350" fill="url(#dots_13_REV)"/>

  <!-- Ornate Outer Border -->
  <rect x="12" y="12" width="676" height="326" rx="8" fill="none" stroke="#e67e22" stroke-width="2.5" opacity="0.85"/>
  <rect x="18" y="18" width="664" height="314" rx="6" fill="none" stroke="rgba(255,255,255,0.25)" stroke-dasharray="6,4" stroke-width="1"/>

  <!-- Corner Rosettes -->
  <g fill="#e67e22" opacity="0.9" font-family="'Georgia', serif" font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="42" cy="40" r="18" fill="rgba(0,0,0,0.5)" stroke="#e67e22" stroke-width="1.5"/>
    <text x="42" y="45">1</text>
    <circle cx="658" cy="40" r="18" fill="rgba(0,0,0,0.5)" stroke="#e67e22" stroke-width="1.5"/>
    <text x="658" y="45">1</text>
    <circle cx="42" cy="310" r="18" fill="rgba(0,0,0,0.5)" stroke="#e67e22" stroke-width="1.5"/>
    <text x="42" y="315">1</text>
    <circle cx="658" cy="310" r="18" fill="rgba(0,0,0,0.5)" stroke="#e67e22" stroke-width="1.5"/>
    <text x="658" y="315">1</text>
  </g>

  <!-- Header Text -->
  <text x="350" y="46" fill="#f0ede6" font-family="'Georgia', serif" font-size="20" font-weight="bold" letter-spacing="4" text-anchor="middle">
