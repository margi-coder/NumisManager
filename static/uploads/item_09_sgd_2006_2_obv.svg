      <stop offset="0%" stop-color="#2b1b36"/>
      <stop offset="50%" stop-color="#452b57"/>
      <stop offset="100%" stop-color="#2b1b36"/>
    </linearGradient>
    <pattern id="guilloche_9_OBS" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 5 0 10 10 T 20 10" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
      <path d="M 10 0 Q 0 5 10 10 T 10 20" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="0.8"/>
