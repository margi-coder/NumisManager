  <!-- Serial Number -->
  <g font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ff4d4d">
    <rect x="90" y="272" width="160" height="24" rx="4" fill="rgba(0,0,0,0.6)" stroke="rgba(255,77,77,0.4)" stroke-width="1"/>
    <text x="170" y="288" text-anchor="middle">JPN-1943-SN001928</text>

    <rect x="450" y="272" width="160" height="24" rx="4" fill="rgba(0,0,0,0.6)" stroke="rgba(255,77,77,0.4)" stroke-width="1"/>
    <text x="530" y="288" text-anchor="middle">JPN-1943-SN001928</text>
  </g>

  <!-- Side Badge -->
  <rect x="250" y="306" width="200" height="22" rx="11" fill="#3498db" opacity="0.95"/>
  <text x="350" y="321" fill="#0a0c10" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">
    TAMPAK BELAKANG • REVERSE
